parameters:
  - name: terraformWorkingDir
    type: string

steps:
  - task: TerraformTask@5
    displayName: Terraform Init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '${{ parameters.terraformWorkingDir }}'
      backendServiceArm: 'Azure-ADO-Pipeline'
      backendAzureRmStorageAccountName: '$(azureBackendAzureRmStorageAccountName)'
      backendAzureRmContainerName: '$(azureBackendAzureRmContainerName)'
      backendAzureRmKey: '$(azureBackendAzureRmKey)'