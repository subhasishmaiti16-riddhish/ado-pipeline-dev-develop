parameters:
  - name: terraformWorkingDir
    type: string
  - name: serviceConnection
    type: string
  - name: backendResourceGroup
    type: string
  - name: backendStorageAccount
    type: string
  - name: backendContainer
    type: string
  - name: backendKey
    type: string

steps:
  - powershell: |
      git config --global url."https://pat:$($env:SYSTEM_ACCESSTOKEN)@dev.azure.com/".insteadOf "https://dev.azure.com/"
    displayName: 'Configure Git Credentials for Terraform Modules'
    env:
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - task: TerraformTask@5
    displayName: Terraform Init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '${{ parameters.terraformWorkingDir }}'
      backendServiceArm: '${{ parameters.serviceConnection }}'
      backendAzureRmResourceGroupName: '${{ parameters.backendResourceGroup }}'
      backendAzureRmStorageAccountName: '${{ parameters.backendStorageAccount }}'
      backendAzureRmContainerName: '${{ parameters.backendContainer }}'
      backendAzureRmKey: '${{ parameters.backendKey }}'