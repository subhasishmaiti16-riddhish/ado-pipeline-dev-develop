parameters:
  - name: terraformWorkingDir
    type: string
  - name: serviceConnection
    type: string
  - name: backendResourceGroup
    type: string
  - name: backendStorageAccount
    type: string
  - name: backendContainer
    type: string
  - name: backendKey
    type: string

steps:
  - powershell: |
      # Remove any stale extraheaders that might have been saved on self-hosted agent
      try {
          git config --global --get-regexp "http\..*\.extraheader" | ForEach-Object {
              $k = ($_ -split " ")[0]
              if ($k) { git config --global --unset-all $k }
          }
      } catch {}

      $token = if ($env:MODULE_PAT) { $env:MODULE_PAT } elseif ($env:MODULE_PLUS_PAT) { $env:MODULE_PLUS_PAT } else { $env:SYSTEM_ACCESSTOKEN }

      git config --global url."https://pat:$($token)@dev.azure.com/".insteadOf "https://dev.azure.com/"
      Write-Host "Git credentials successfully configured for Azure DevOps repositories."
    displayName: 'Configure Git Credentials for Terraform Modules'
    env:
      MODULE_PAT: $(MODULE_PAT)
      MODULE_PLUS_PAT: $(MODULE+PAT)
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  - task: TerraformTask@5
    displayName: Terraform Init
    inputs:
      provider: 'azurerm'
      command: 'init'
      workingDirectory: '${{ parameters.terraformWorkingDir }}'
      backendServiceArm: '${{ parameters.serviceConnection }}'
      backendAzureRmResourceGroupName: '${{ parameters.backendResourceGroup }}'
      backendAzureRmStorageAccountName: '${{ parameters.backendStorageAccount }}'
      backendAzureRmContainerName: '${{ parameters.backendContainer }}'
      backendAzureRmKey: '${{ parameters.backendKey }}'