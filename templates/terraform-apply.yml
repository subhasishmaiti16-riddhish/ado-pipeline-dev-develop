parameters:
  - name: terraformWorkingDir
    type: string

steps:
  - task: TerraformTask@5
    displayName: Terraform Apply
    inputs:
      provider: 'azurerm'
      command: 'apply'
      workingDirectory: '${{ parameters.terraformWorkingDir }}'
      commandOptions: 'tfplan'
      environmentServiceNameAzureRM: '${{ parameters.serviceConnection }}'
