pool: DevOps-pipeline

trigger:
  branches:    ###Branch filter
    include:
    - develop
    - feature/*
  paths:       ###Path filter
    include:
      - env/dev/*

variables:
  terraformWorkingDir: '$(System.DefaultWorkingDirectory)/env/dev'
  azureServiceConnection: 'Azure-ADO-Pipeline'
  backendResourceGroup: 'rg-devops'
  backendStorageAccount: 'datablockstorage'
  backendContainer: 'aksstoragecont'
  backendKey: 'env.aksstoragecont'

stages:
- stage: terraformInitValidateAndPlan
  displayName: Terraform Init Validate And Plan
  jobs:
  - job: terraformInitAndValidate
    displayName: Terraform Init Validate And Plan
    steps:

    - template: templates/terraform-install.yml
      parameters:
        terraformVersion: '1.9.8'

    - script: |
        where terraform
        terraform version
      displayName: Verify Terraform Installation

    - template: templates/terraform-init.yml
      parameters:
        terraformWorkingDir: '$(terraformWorkingDir)'

    
    - template: templates/terraform-validate.yml
      parameters:
        terraformWorkingDir: '$(terraformWorkingDir)'

    - template: templates/terraform-plan.yml
      parameters:
        terraformWorkingDir: '$(terraformWorkingDir)'

- stage: terraformApply
  dependsOn: terraformInitValidateAndPlan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
  jobs:
  - job: TerraformApply
    steps:
    - template: templates/terraform-init.yml
      parameters:
        terraformWorkingDir: '$(terraformWorkingDir)'

    - template: templates/terraform-apply.yml
      parameters:
        terraformWorkingDir: '$(terraformWorkingDir)'
